<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>The editor moved — HippoCampus Robotics</title>
  <!-- The old editor's address. The editor now lives in the site itself
       (Editor mode): js/cms-redirect.js sends every old #/… route to the
       site page it belongs to, with the Editor-mode parameter that opens the
       right tray tab (plan D-I), at once and without a history entry. The
       GitHub App's sign-in callback, cms/callback.html, stays here.
       Local script only: no inline script, no on*= handler, no CDN
       (tools/check.py section 7 holds that line). -->
  <script src="../js/cms-redirect.js"></script>
</head>
<body>
  <main>
    <h1>The editor moved into the site</h1>
    <p>Pages are now edited where they stand: open the page, sign in with
      "Sign in to edit" at the bottom, and switch Editor on.</p>
    <p><a href="../">Go to the site</a></p>
    <noscript><p>The site needs JavaScript to edit pages.</p></noscript>
  </main>
</body>
</html>
