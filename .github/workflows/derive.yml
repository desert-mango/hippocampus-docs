# derive — regenerate and commit the derived data after every push to main.
#
# Derived data = files that are a pure function of the content: search/site.json,
# search/manifest.json, data/graph/{wiki,summaries,xref-terms}.json, when its
# inputs changed data/graph/contributors.json, and on every run the GitHub layer
# data/graph/{org-activity,github-repos,page-authors,people-public}.json plus
# data/graph/avatars/ (public reads; its step fails SOFT — a ::warning, the
# previous GitHub data kept, the rest still committed). Pull requests never commit them
# (the CI `check` job regenerates them in its workspace instead); this workflow
# commits them on main right after the merge.
#
# Who pushes (Kyle, 2026-10-15): the org-owned GitHub App of the `derive`
# environment. The `main-review` ruleset requires a reviewed pull request on
# main, and GitHub refuses the GitHub Actions app as a ruleset bypass actor here;
# the App is one. tools/github_app_token.py mints its installation token (this
# repository only, contents: write only, about an hour, revoked on exit) from
# the environment's secret DERIVE_APP_PRIVATE_KEY and its App id DERIVE_APP_ID (kept as a
# secret there; a variable of that name is read first if one is ever added).
# The `derive` environment admits the main branch only, so no other branch's
# workflow can read the key. The GITHUB_TOKEN stays read-only and is never
# stored in .git/config (persist-credentials: false); the App token reaches git
# only through the push's own environment.
#
# The loop guard: unlike GITHUB_TOKEN's, a push made with an App token starts
# workflows, so this job skips every push made by a bot (the App is
# `<slug>[bot]`). It does not skip by commit message: a human commit that
# happens to start with derive's subject still gets its data rebuilt. CI's
# `check` does run on the derive commit — the gate judges it on main like any
# other commit.
#
# The job runs the offline gate before pushing and pushes nothing when it is
# red: a red gate is content to fix, never something to push past.
name: derive

on:
  push:
    branches: [main]

# One run at a time on main; a newer push waits for the running one.
concurrency: derive-main

permissions:
  contents: read

jobs:
  derive:
    name: derive
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-24.04
    environment: derive
    permissions:
      contents: read        # the App token pushes; GITHUB_TOKEN only reads
      pull-requests: read   # build_github_data.py lists this repo's pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 — resolved via gh api repos/actions/checkout/git/ref/tags/v7 on 2026-09-03
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Regenerate, check, commit and push the derived data
        env:
          # build_contributors.py and build_github_data.py call `gh api` for
          # public data only (contributor counts; org activity, repo cards, page
          # history, pull requests, profiles' display names).
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          DERIVE_APP_ID: ${{ vars.DERIVE_APP_ID || secrets.DERIVE_APP_ID }}
          DERIVE_APP_PRIVATE_KEY: ${{ secrets.DERIVE_APP_PRIVATE_KEY }}
        # derive.py resolves BEFORE itself: a multi-commit push or a new branch
        # (all-zeros sha) may leave it outside this shallow checkout, and then it
        # fetches it or treats the contributor inputs as changed.
        #
        # On a non-fast-forward rejection (main moved while this ran) the local
        # bot commit is dropped, the job moves to the new tip and regenerates
        # from there — derived data is a function of the tree, so rebuilding it
        # is always correct, and it cannot hit a rebase conflict in a generated
        # file. At most 3 attempts.
        #
        # The App token is minted only when there is something to push, masked
        # at once, kept in a shell variable, and handed to git for the push alone
        # (GIT_CONFIG_* environment: never argv, never .git/config).
        run: |
          set -euo pipefail
          APP_TOKEN=""
          trap 'DERIVE_APP_TOKEN="$APP_TOKEN" python3 tools/github_app_token.py --revoke || true' EXIT
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt: derive"
            python3 tools/derive.py --contributors-if-changed "$BEFORE" --github-data | tee "$RUNNER_TEMP/derive-output.txt"
            echo "::endgroup::"
            if grep -qF "derive: build_github_data.py FAILED — previous GitHub data kept" "$RUNNER_TEMP/derive-output.txt"; then
              echo "::warning title=derive::build_github_data.py failed — the previous GitHub data was kept; the next push catches it up"
            fi
            python3 tools/check.py
            if [ -z "$(git status --porcelain search/ data/graph/)" ]; then
              echo "derive: nothing to commit"
              exit 0
            fi
            if [ -z "$APP_TOKEN" ]; then
              creds=$(python3 tools/github_app_token.py)
              APP_TOKEN=${creds%%$'\n'*}
              echo "::add-mask::$APP_TOKEN"
              rest=${creds#*$'\n'}
              git config user.name "${rest%%$'\n'*}"
              git config user.email "${rest#*$'\n'}"
              unset creds rest
              echo "derive: pushing as $(git config user.name)"
            fi
            short=$(git rev-parse --short HEAD)
            git add -A search/ data/graph/
            git commit -q -m "derive: regenerate derived data after $short"
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
            echo "::add-mask::$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
            if out=$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                     GIT_CONFIG_VALUE_0="$auth" git push origin HEAD:main 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            # Only a moved main is retried; anything else (403, network) fails now.
            if ! grep -qE 'non-fast-forward|fetch first|\[rejected\]' <<<"$out"; then
              echo "::error title=derive::push refused (not a moved main) — see the lines above"
              exit 1
            fi
            echo "push rejected (main moved); regenerating on the new tip"
            git fetch --quiet --depth=2 origin main
            git reset --quiet --hard origin/main
          done
          echo "::error title=derive::push still rejected after 3 attempts"
          exit 1
