# CI for hippocampus-docs — a zero-build static site (what you edit is what serves).
#
# One job, `check`: the repo's offline gate, `python3 tools/check.py`, run
# verbatim on every pull request and every push to main. Around that one
# command:
#   - on pull requests only, the derived data (wiki graph + site search shard)
#     is regenerated in the workspace first, NOT committed, so the gate judges
#     what main will hold once derive.yml has run after the merge. A lab member
#     who adds a project never needs a terminal to make this job green.
#   - on push to main nothing is regenerated: the gate judges the committed
#     tree, so this job agrees with the deploy build.
#   - on pull requests only, a guard step fails the job when the pull request
#     itself commits data/graph/contributors.json, data/graph/edit-access.json
#     or .github/CODEOWNERS (unless a bot opened it): those files decide who may
#     edit what, so they reach main only through derive.
#   - when the gate fails, every finding is re-emitted as a GitHub annotation
#     (file + line where the message names them), and the job summary keeps
#     the full output.
# derive.yml (a separate workflow) regenerates and commits the derived data on
# main after each merge.
#
# The job name `check` is load-bearing: the CMS Review tab and the docs refer
# to the check run by that name. Do not rename it.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Minimal token. This workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 2: on a pull request the checked-out commit is GitHub's
      # merge commit, and its first parent (HEAD^1) is the base branch tip —
      # the notice step below diffs against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 — resolved via gh api repos/actions/checkout/git/ref/tags/v7 on 2026-09-03
        with:
          fetch-depth: 2

      # This job deliberately uses the runner image's system python3. Every
      # tool here is stdlib-only, so there is no setup-python step and no pip
      # install — nothing to resolve, nothing to cache, nothing to drift. The
      # runner image is pinned to an exact version above rather than tracking
      # the floating rolling alias, so the interpreter only ever moves when
      # someone edits this file on purpose.
      # Who may edit what (Kyle, 2026-10-19) is decided by three derived files.
      # A pull request may not carry them: it judges the PR's COMMITTED diff
      # (base tip HEAD^1 against the merge commit HEAD), never the workspace,
      # which the derive step below rewrites. Its own step, before that one.
      - name: Refuse authorization data in a pull request
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          carried=$(git diff --name-only HEAD^1 HEAD -- data/graph/contributors.json data/graph/edit-access.json .github/CODEOWNERS)
          if [ -z "$carried" ]; then
            echo "no authorization data in this pull request"
            exit 0
          fi
          case "$PR_AUTHOR" in
            *'[bot]')
              echo "a bot's pull request carries: $carried"
              ;;
            *)
              echo "::error title=check::this pull request commits $carried — who may edit what enters main only through derive (derive.yml rebuilds these files after the merge); drop them from the pull request"
              exit 1
              ;;
          esac

      - name: Regenerate derived data in the workspace (not committed) so the gate judges what main will hold after derive.yml
        if: github.event_name == 'pull_request'
        # Never aborts the job: derive's exit code is recorded, and the gate
        # below still runs and reports on its own. build_contributors.py is not
        # run here (network-bound): build_edit_access.py reads the committed
        # contributors.json and fails without it (so does derive, and then the
        # gate names the missing file), because who may edit is never guessed.
        run: |
          set -o pipefail
          set +e
          python3 tools/derive.py 2>&1 | tee derive-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "derive.py exited $rc (derived data regenerated in the workspace, not committed)"
            echo '```text'
            cat derive-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Run the offline gate (tools/check.py)
        # Why this shape:
        #   pipefail + ${PIPESTATUS[0]} preserve the gate's exit code through tee —
        #     without them the step's status would be tee's, which is always 0.
        #   2>&1 folds stderr into the pipe so a stack trace lands in the summary
        #     instead of leaving readers an empty fenced block.
        #   tee also keeps a copy in gate-output.txt for the annotation step.
        #   The set +e / set -e dance keeps GitHub's default `bash -e` from aborting
        #     the step the instant the gate fails, which would leave the fence in the
        #     job summary unclosed and swallow the rest of the log.
        run: |
          set -o pipefail
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          set +e
          python3 tools/check.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" gate-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Annotate the failures
        if: failure()
        # derive-output.txt exists on pull requests only; on push to main only
        # gate-output.txt does. A missing file is skipped, never an error.
        run: |
          files=()
          for f in derive-output.txt gate-output.txt; do
            [ -f "$f" ] || continue
            files+=("$f")
          done
          if [ ${#files[@]} -gt 0 ]; then
            python3 tools/derive.py --annotate "${files[@]}"
          fi

      - name: Note derived files carried by the pull request
        if: always() && github.event_name == 'pull_request'
        # Only the files derive.py writes count as "carried" — a PR that edits
        # the authored overlay data/graph/edges-authored.json is not carrying
        # derived data.
        run: |
          if [ -n "$(git status --porcelain search/ data/graph/ .github/CODEOWNERS)" ] && \
             [ -n "$(git diff --name-only HEAD^1 HEAD -- search/site.json search/manifest.json \
                    data/graph/wiki.json data/graph/summaries.json data/graph/xref-terms.json \
                    data/graph/contributors.json data/graph/edit-access.json .github/CODEOWNERS)" ]; then
            echo "::notice::this PR carries derived files; derive.yml regenerates them after merge — no action needed"
          fi
