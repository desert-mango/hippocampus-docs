# CI for hippocampus-docs — a zero-build static site (what you edit is what serves).
#
# Two jobs, and the difference between them is the whole design:
#   check                  the repo's offline gate, run verbatim. This is the job
#                          that becomes the REQUIRED status check on main.
#   search-shard-advisory  a detector for the maintainer. Advisory forever: it is
#                          never added to required checks and always exits 0.
#
# Job names are load-bearing — branch protection selects a check run by job name,
# so renaming a job silently unhooks (or breaks) the required check.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Minimal token. Both jobs only ever read the repository.
permissions:
  contents: read

jobs:
  check:
    # Pinned name: this is the string selected in branch protection. Do not rename.
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 — resolved via gh api repos/actions/checkout/git/ref/tags/v7 on 2026-09-03

      # This job deliberately uses the runner image's system python3. The gate is
      # stdlib-only, so there is no setup-python step and no pip install — nothing
      # to resolve, nothing to cache, nothing to drift. The runner image is pinned
      # to an exact version above rather than tracking the floating rolling alias,
      # so the interpreter only ever moves when someone edits this file on purpose.
      - name: Run the offline gate (tools/check.py)
        # Why this shape:
        #   pipefail + ${PIPESTATUS[0]} preserve the gate's exit code through tee —
        #     without them the step's status would be tee's, which is always 0.
        #   2>&1 folds stderr into the pipe so a stack trace lands in the summary
        #     instead of leaving readers an empty fenced block.
        #   The set +e / set -e dance keeps GitHub's default `bash -e` from aborting
        #     the step the instant the gate fails, which would leave the fence in the
        #     job summary unclosed and swallow the rest of the log.
        run: |
          set -o pipefail
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          set +e
          python3 tools/check.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  search-shard-advisory:
    # Pinned name: keep this OUT of required checks. See the step comment below.
    name: search-shard-advisory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 — resolved via gh api repos/actions/checkout/git/ref/tags/v7 on 2026-09-03

      - name: Detect a stale search shard (advisory — maintainer only)
        # This job is a DETECTOR FOR THE MAINTAINER, never a gate. search/ is
        # generated, and contributors are told not to touch it; showing one of them
        # a red X over a directory they were asked to leave alone is a bug, not a
        # signal. So every path through this step ends in exit 0, and the findings
        # are surfaced as ::warning:: annotations plus a job-summary line.
        #
        # Deliberately NO error-suppressing job/step flag anywhere in this file:
        # there is nothing here for one to mask (the step cannot fail), and the
        # job-level form still renders a red check run — exactly the outcome this
        # job exists to avoid. The guaranteed `exit 0` below is the whole mechanism.
        #
        # git status is scoped to search/ so the shard rebuild's own shard.log (an
        # untracked file at the repo root) can never be mistaken for drift.
        run: |
          if ! python3 tools/build_search_index.py --site-only >shard.log 2>&1; then
            echo "::warning::MAINTAINER: shard rebuild could not run on this PR (see the check job) — no action for the contributor"
            exit 0
          fi
          if [ -n "$(git status --porcelain search/)" ]; then
            echo "::warning::MAINTAINER: search shard refresh needed before merge — no action for the contributor"
            echo "MAINTAINER: search shard refresh needed before merge — no action for the contributor" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
