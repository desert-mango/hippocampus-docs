<!doctype html>
<!--
  The Editor walk — a TEST-ONLY page (plan D-C, U6). Never deployed
  (.vercelignore: tools/tests/*.html) and inert anywhere but localhost /
  127.0.0.1. Driven by the run's smoke.mjs (--shots <dir> --walk) through
  headless Chrome, or open it by hand under ./tools/serve.sh:
    http://localhost:8130/tools/tests/editor_walk.html?step=edit&page=/setup/lab-gantry/usage

  It frames the REAL site (../../index.html#<page>, same origin, no sandbox:
  a plain hash, so js/source.js does NOT turn preview mode on) and loads the
  Editor through the site's own seam, window.HCApp.loadEditor({fetch,
  session}): `fetch` is tools/tests/fake_github.js over the U0 fixtures and
  this tree's files (no network, no GitHub), `session` a fake one held in
  memory only (never written under the real session key). Then it drives
  the Editor to one state:

    on               the header switch on: the page frame at the route
    select           on + the frame says hc-block-select (a paragraph block)
    edit             select + typing in the tray's block editor; the frame
                     reloads with a NEW nonce, the block still selected
    on-geometry      (U7) Editor on changes nothing in the page's geometry:
                     the text column (#content inside its padding), the h1
                     and the sidebar before; the frame's own column and h1
                     (hc-walk-scroll's rects) and the sidebar after the frame
                     is on screen (body.hc-frame-live; the sidebar only when
                     it was on screen before: never on a phone or with the
                     drawer closed, at 900 px and below); ready only when equal
                     within 1 px, #content is display:none, and the swap came
                     from this load's second hc-ready, before the 8 s
                     fallback. Writes data-walk-geometry
    scroll           (U7) on + select the page's LAST paragraph (low on the
                     page); ask the frame (hc-walk-scroll, the TEST-ONLY hook
                     below) until its scrollY is >= 100 px and steady over 3
                     answers. No typing (U4's). Writes data-walk-scroll-before
    insert           on + the "+" rail before the first paragraph with its
                     picker OPEN (the kinds, before one is chosen; mockup
                     a-3): the frame's own rail button is clicked through
                     js/editor-frame.js's test-only walk hook (below)
    inserted         on + the frame says hc-block-insert {index, 'note'}: the
                     note inserted, selected, its Markdown in the tray
    phone            on + the tray open, under 768 px (the bottom sheet); the
                     site's frame is 390 px wide (smoke.mjs shoots it at 390)
    overlay-inline   (U7) on, with a synthetic open proposal #2 on this page
                     drawn over main: an added note, a changed paragraph (old
                     above new), a paragraph main also changed (the "main
                     changed this" mark), and the page bar above the frame
    overlay-side     the same, with the View setting "Side by side"
    two-prs          proposal #2 and a newer #3 on this page: #3 is drawn, the
                     page bar lists #2 with its own "Show on page"
    members          (U4) Editor OFF, a member (Write): the members-only detail
                     js/editor.js draws through the org reader. On a setup
                     page: "who wrote this" with per-author counts and date
                     ranges, scrolled into view. On /lab: authors on recent
                     commits, "People committing this year", and the popover
                     of its first row opened (counts, projects, recent
                     commits); on /about: the GitHub strips on the cards.
    access-*         (edit access, 2026-10-19) Editor OFF on a project page
                     (&page=/projects/core-stack is the default for these
                     steps): the "Edit access" box at the top of the aside.
                     The fake GitHub gets a synthetic data/graph/edit-access.json
                     and data/projects.json at main's sha (extra.contents),
                     never the tree's file; the walk's login (user.json)
                     lands in the step's state:
                       access-sitewide  Maintainer (&variant=admin: Admin)
                       access-commits   Write, commits in 2 of the repos
                       access-added     Write, added by an admin
                       access-removed   Write, removed by an admin (Request shown)
                       access-nowrite   read-only, commits (the issue link)
                       access-none      Write, not listed (Request shown)
                       access-admin     Admin: Remove per person, Add person

  The synthetic proposals (U7) are built here from the page's own Markdown
  with HCCore.splitBlocks and handed to the fake GitHub as `extra`; PR #1
  (the real, read-only fixture) stays as it is. The members step (U4) hands
  the fake the U0 Ubuntu page's old-docs history as the walk page's (the
  fixtures hold three pages' histories, none of them a walk page) and one
  synthetic commit of the page on this site; the year view reads the U0
  year fixtures (docs) and [] for every other repository. &width=<px> (smoke.mjs, for
  widths headless Chrome will not make on a Mac) sizes the site's frame.

  The frame's own messages (hc-block-select / hc-block-insert) cannot be
  clicked from here: the Editor's page frame is sandboxed (opaque origin).
  The walk dispatches the SAME message to the site window with the frame
  as its source and the frame's current nonce, so the parent's real
  checks (event.source, nonce) and code path run; the frame-side click ->
  message is proven by test_editor_frame.mjs and the browser oracle.
  The "+" picker is the frame's own and no message opens it, so the insert
  step uses js/editor-frame.js's TEST-ONLY hook (localhost / 127.0.0.1, and
  only when a top window that is not the parent sits above the site): this
  page posts {type: 'hc-walk-picker', index} into the page frame, the frame
  clicks its real "+" button and answers {type: 'hc-walk-picker-open',
  index, open, kinds}; insert is ready only when open with all the kinds.
  The scroll step uses the same hook's {type: 'hc-walk-scroll'}: the frame
  answers {type: 'hc-walk-scroll-samples', samples, log, loadedAt, nonce16,
  now} — its document's scrollY since it loaded.

  When the state is reached, THIS page's body gets
  data-walk-step="<step>:ready" (smoke.mjs asserts it in --dump-dom, then
  takes the screenshot); on failure "<step>:failed" and data-walk-why.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Editor walk</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; }
  iframe { display: block; width: 100%; height: 100vh; border: 0; }
</style>
</head>
<body data-walk-step="starting">
<script src="fake_github.js"></script>
<script src="../../js/marked.min.js"></script>
<script src="../../js/cms-core.js"></script>
<script>
(function () {
  'use strict';
  const body = document.body;
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    body.setAttribute('data-walk-step', 'refused');
    return;
  }
  const REGISTRY = stepRegistry();   // the steps, by unit (below)
  const STEPS = Object.keys(REGISTRY);
  const ACCESS_STEPS = STEPS.filter((s) => s.indexOf('access-') === 0);
  const OVERLAY_STEPS = ['overlay-inline', 'overlay-side', 'two-prs'];
  const params = new URLSearchParams(location.search);
  const step = params.get('step') || 'on';
  const page = params.get('page') || (/^access-/.test(step) ? '/projects/core-stack' : '/setup/hippocampus-bringup/fcu-firmware');
  const LIMIT_MS = 20000;
  const SETTLE_MS = 900;

  const mark = (s) => body.setAttribute('data-walk-step', s);
  const fail = (why) => { mark(`${step}:failed`); body.setAttribute('data-walk-why', String(why).slice(0, 300)); };
  if (STEPS.indexOf(step) < 0) { fail(`unknown step ${step}`); return; }
  if (!/^\/[A-Za-z0-9/_-]*$/.test(page)) { fail('page must be a site route like /setup/x/y'); return; }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function until(pred, what) {
    const end = Date.now() + LIMIT_MS;
    for (;;) {
      let v = null;
      try { v = pred(); } catch (e) { v = null; }
      if (v) return v;
      if (Date.now() > end) throw new Error(`timed out waiting for ${what}`);
      await sleep(50);
    }
  }

  const readText = (url) => fetch(url, { cache: 'no-store' })
    .then((r) => (r.ok ? r.text() : null)).catch(() => null);
  const pageFile = () => { const m = /^\/setup\/(.+)$/.exec(page); return m ? `content/setup/${m[1]}.md` : null; };

  /* U7: synthetic open proposals on this page, from its own Markdown.
     #2 (on a merge base where one paragraph had an older wording, so main
     has changed it since): adds a note after the title, changes the second
     paragraph, and rewrites the first one too (a conflict with main). #3
     (built on main, newer): adds one paragraph after the title. */
  async function synthetic() {
    const file = pageFile();
    const main = file ? await readText(`../../${file}`) : null;
    const split = main ? window.HCCore.splitBlocks(main) : null;
    if (!split || !split.ok) throw new Error(`the walk page ${page} does not split into blocks`);
    const texts = split.blocks.map((b) => b.text);
    const tail = (t) => t.match(/\n*$/)[0] || '\n';
    const core = (t) => t.replace(/\n+$/, '');
    const paras = split.blocks.map((b, i) => (b.kind === 'paragraph' ? i : -1)).filter((i) => i >= 0);
    const h1 = Math.max(0, split.blocks.findIndex((b) => b.kind === 'heading'));
    const base = texts.slice();
    const head = texts.slice();
    if (paras.length) {
      base[paras[0]] = `An older wording of this paragraph, before main changed it.${tail(texts[paras[0]])}`;
      head[paras[0]] = `The proposal rewrote this paragraph as well.${tail(texts[paras[0]])}`;
    }
    if (paras.length > 1) {
      head[paras[1]] = `${core(texts[paras[1]])} The proposal adds this sentence to the paragraph.${tail(texts[paras[1]])}`;
    }
    head[h1] = `${core(head[h1])}\n\n<div class="adm adm-note"><p class="adm-title">Note</p>\n\nThe proposal adds this note `
      + `right after the title.\n\n</div>${tail(head[h1])}`;
    const three = texts.slice();
    three[h1] = `${core(three[h1])}\n\nA second, newer proposal adds this paragraph.${tail(three[h1])}`;
    const pull1 = JSON.parse(await readText('fixtures/github-data/pull-1.json'));
    const checks = JSON.parse(await readText('fixtures/github-data/check-runs-d0bdc64.json'));
    const sha = (c) => c.repeat(40).slice(0, 40);
    const pull = (n, login, created, headSha) => Object.assign({}, pull1, { number: n, title: `Walk proposal #${n}`,
      created_at: created, user: Object.assign({}, pull1.user, { login }),
      head: Object.assign({}, pull1.head, { sha: headSha, ref: `cms/${login}/walk-${n}` }) });
    const row = { filename: file, status: 'modified', additions: 3, deletions: 2, changes: 5, patch: '@@ -1 +1 @@' };
    const extra = {
      pulls: [pull(2, 'walk-proposer', '2026-09-29T09:00:00Z', sha('b2'))],
      files: { 2: [row] },
      contents: { [sha('ba5e')]: { [file]: base.join('') }, [sha('b2')]: { [file]: head.join('') } },
      compare: { [sha('b2')]: sha('ba5e') },
      checks: { [sha('b2')]: checks },
      comments: { 2: [] },                     // U5b: the approval records the walk's Approve writes land here
      reviewComments: { 2: [] },               // U6: the conversations the walk's Comment and Reply write land here
      roles: { 'walk-proposer': 'write', 'kyle-nelson-berkeley': variant === 'readonly' ? 'read' : (variant || 'write') },
    };
    if (step === 'two-prs') {
      extra.pulls.push(pull(3, 'newer-proposer', '2026-09-30T09:00:00Z', sha('b3')));
      extra.files[3] = [Object.assign({}, row, { additions: 2, deletions: 0, changes: 2 })];
      extra.contents[sha('b3')] = { [file]: three.join('') };
      extra.compare[sha('b3')] = window.HCFakeGitHub.MAIN_SHA;
      extra.checks[sha('b3')] = { total_count: 0, check_runs: [] };
    }
    return extra;
  }

  /* U4: the walk page's old-docs history = the Ubuntu page's U0 fixtures (current
     path, pre-move path, pre-rename path), and one synthetic commit on this site. */
  async function membersExtra() {
    const m = /^\/setup\/(.+)$/.exec(page);
    if (!m) return {};
    const doc = JSON.parse(await readText('../../data/graph/page-authors.json') || 'null');
    const entry = doc && doc.pages && doc.pages[`setup/${m[1]}`];
    const file = entry && entry.original && typeof entry.original.path === 'string' ? entry.original.path : null;
    const orgCommits = {};
    if (file && /^contents\//.test(file)) {
      const pre = file.slice('contents/'.length);
      orgCommits[`docs/${file}`] = 'page-commits-ubuntu-current.json';
      orgCommits[`docs/${pre}`] = 'page-commits-ubuntu-premove.json';
      if (/^raspberry_pi_setup\//.test(pre)) {
        orgCommits[`docs/raspberry_pi_4b_setup/${pre.slice('raspberry_pi_setup/'.length)}`] = 'page-commits-ubuntu-pre-restructure.json';
      }
    }
    const repoCommits = { [`content/setup/${m[1]}.md`]: [{ sha: `b40ade4${'0'.repeat(33)}`,
      commit: { author: { name: 'Kyle Nelson', date: '2026-08-28T12:00:00Z' }, message: 'walk: the conversion commit (synthetic)' },
      author: { login: 'kyle-nelson-berkeley' } }] };
    return { orgCommits, repoCommits };
  }

  // &variant=admin|maintain|readonly (U5b: a reviewer who may approve any page); default: Write.
  // The access steps set their own (access-sitewide takes &variant=admin too).
  const ACCESS_VARIANT = { 'access-sitewide': params.get('variant') === 'admin' ? 'admin' : 'maintain', 'access-commits': undefined,
    'access-added': undefined, 'access-removed': undefined, 'access-nowrite': 'readonly', 'access-none': undefined,
    'access-admin': 'admin' };
  const variant = Object.prototype.hasOwnProperty.call(ACCESS_VARIANT, step) ? ACCESS_VARIANT[step]
    : (['admin', 'maintain', 'readonly'].indexOf(params.get('variant')) >= 0 ? params.get('variant') : undefined);
  // U5b: an approval record written by the page is kept as proposal #2's comment (window.walkWrites lists every write)
  window.walkWrites = [];
  const onWrite = (extra) => (method, url, body) => {
    window.walkWrites.push({ method, url, body });
    const m = /\/issues\/([0-9]+)\/comments$/.exec(url);
    if (method === 'POST' && m && extra && extra.comments && body && typeof body.body === 'string') {
      const t = new Date().toISOString();
      (extra.comments[m[1]] = extra.comments[m[1]] || []).push({ id: Date.now(), user: { login: 'kyle-nelson-berkeley', type: 'User' },
        body: body.body, created_at: t, updated_at: t });
      return { status: 201, body: {} };
    }
    // U6: review comments on proposal #2 (a conversation and its replies), and the GraphQL door's three operations
    const rc = /\/pulls\/([0-9]+)\/comments(?:\/([0-9]+)\/replies)?$/.exec(url);
    if (method === 'POST' && rc && extra && body && typeof body.body === 'string') {
      const t = new Date().toISOString();
      const list = (extra.reviewComments[rc[1]] = extra.reviewComments[rc[1]] || []);
      const root = rc[2] ? list.find((c) => String(c.id) === rc[2]) : null;
      const c = { id: list.length + 1000, user: { login: 'kyle-nelson-berkeley' }, body: body.body, created_at: t,
        path: root ? root.path : body.path, line: root ? root.line : body.line, side: root ? root.side : body.side,
        in_reply_to_id: root ? root.id : undefined };
      list.push(c);
      return { status: 201, body: c };
    }
    if (method === 'POST' && /\/graphql$/.test(url) && body && typeof body.query === 'string') {
      window.walkResolved = window.walkResolved || {};
      const id = body.variables && body.variables.id;
      if (/^mutation/.test(body.query)) {
        window.walkResolved[id] = /resolveReviewThread/.test(body.query) && !/unresolve/.test(body.query);
        return { status: 200, body: { data: {} } };
      }
      const roots = (extra.reviewComments[String(body.variables.n)] || []).filter((c) => c.in_reply_to_id === undefined);
      return { status: 200, body: { data: { repository: { pullRequest: { reviewThreads: { nodes: roots.map((c) => ({
        id: `PRRT_walk${c.id}`, isResolved: Boolean(window.walkResolved[`PRRT_walk${c.id}`]), comments: { nodes: [{ databaseId: c.id }] } })) } } } } } };
    }
    return { status: 405, body: { message: 'the walk takes no other writes' } };
  };
  const fakeFor = (extra) => window.HCFakeGitHub.createFakeGitHub({
    variant,
    onWrite: onWrite(extra),
    readFixture: (name) => readText(`fixtures/github-data/${name}`),
    readFile: (p) => (/^[A-Za-z0-9._/-]+$/.test(p) && p.indexOf('..') < 0 ? readText(`../../${p}`) : Promise.resolve(null)),
    extra,
  });

  /* Edit access: main's data/graph/edit-access.json (the shape tools/build_edit_access.py writes) and
     data/projects.json for the project of the page, with the walk's login in the step's state. */
  async function accessExtra(login) {
    const m = /^\/projects\/([a-z0-9][a-z0-9-]*)$/.exec(page);
    const id = m ? m[1] : 'core-stack';
    const C = window.HCCore;
    const MAIN = window.HCFakeGitHub.MAIN_SHA;
    const mainText = await readText('../../data/projects.json');
    const facts = JSON.parse(await readText(`../../data/projects/${id}.json`) || 'null');
    const repos = facts && Array.isArray(facts.repos) ? facts.repos.filter((r) => r && r.external !== true).length || 1 : 3;
    const editors = [['lab-lead', 'commits', Math.min(3, repos)], ['new-student', 'added', 0]];
    const removed = [];
    let index = mainText;
    const put = (who, op) => { const d = C.accessRequestDraft(index, id, who, op); if (d.text) index = d.text; };
    put('new-student', 'add');
    if (step === 'access-commits' || step === 'access-nowrite') editors.push([login, 'commits', Math.min(2, repos)]);
    if (step === 'access-added') { editors.push([login, 'added', 0]); put(login, 'add'); }
    if (step === 'access-removed') { removed.push([login, true]); put(login, 'remove'); }
    const byLogin = (a, b) => (a[0].toLowerCase() < b[0].toLowerCase() ? -1 : 1);
    const doc = { note: 'Walk data (synthetic): who can edit each project, in the shape of data/graph/edit-access.json.',
      projects: { [id]: { repos,
        editors: editors.sort(byLogin).map(([l, why, k]) => ({ login: l, repos_with_commits: k, why })),
        removed: removed.sort(byLogin).map(([l, had]) => ({ had_commits: had, login: l })) } } };
    const extra = { contents: { [MAIN]: { 'data/graph/edit-access.json': `${JSON.stringify(doc, null, 1)}\n`, 'data/projects.json': index } },
      trees: { [MAIN]: 'e'.repeat(40) } };
    return extra;
  }

  // theme=light|dark (screenshots of both themes): the site reads hc-theme from this origin's storage
  const theme = params.get('theme');
  if (theme === 'light' || theme === 'dark') { try { localStorage.setItem('hc-theme', theme); } catch (e) { /* ok */ } }
  const site = document.createElement('iframe');
  site.title = 'The site';
  site.src = `../../index.html#${page}`;
  // headless Chrome will not make a window narrower than 500 px on a Mac: the
  // phone step sizes the site's own viewport instead
  if (step === 'phone') site.style.width = '390px';
  const width = Number(params.get('width'));
  if (step !== 'phone' && Number.isInteger(width) && width >= 200 && width <= 2000) site.style.width = `${width}px`;
  body.appendChild(site);

  let SW = null;               // the site's window
  let SD = null;               // the site's document
  const readies = [];          // nonces of the page frames that said hc-ready
  const pickerReplies = [];    // the frame's answers to hc-walk-picker (the insert step)
  const scrollReplies = [];    // the frame's answers to hc-walk-scroll (the scroll step)
  window.addEventListener('message', (e) => {
    const f = SD ? pageFrame() : null;
    const m = e.data;
    if (f && e.source === f.contentWindow && m && typeof m === 'object' && m.type === 'hc-walk-picker-open') pickerReplies.push(m);
    if (f && e.source === f.contentWindow && m && typeof m === 'object' && m.type === 'hc-walk-scroll-samples') scrollReplies.push(m);
  });
  const seen = {};             // message type -> count (the failure line)
  const $ = (sel) => SD.querySelector(sel);
  const pageFrame = () => $('#hc-frame-host iframe.hc-frame');
  const nonceOf = (f) => {
    const m = f ? /#preview=([A-Za-z0-9_-]+)/.exec(f.getAttribute('src') || '') : null;
    return m ? m[1] : null;
  };

  // the page frame (the current load) said hc-ready, and its grouping had time to run
  async function frameReady(notNonce) {
    const nonce = await until(() => {
      const n = nonceOf(pageFrame());
      return n && n !== notNonce && readies.indexOf(n) >= 0 ? n : null;
    }, 'the page frame\'s hc-ready');
    await sleep(SETTLE_MS);
    return nonce;
  }

  // what the frame would post: same source, the current load's nonce
  function frameSays(type, data) {
    const f = pageFrame();
    const msg = Object.assign({ type, nonce: nonceOf(f) }, data);
    SW.dispatchEvent(new SW.MessageEvent('message', { data: msg, origin: 'null', source: f.contentWindow }));
  }

  // the block to select / insert before: the page's first paragraph
  async function paragraphIndex() {
    const m = /^\/setup\/(.+)$/.exec(page);
    const text = m ? await readText(`../../content/setup/${m[1]}.md`) : null;
    const split = text ? window.HCCore.splitBlocks(text) : null;
    const blocks = split && split.ok ? split.blocks : [];
    const i = blocks.findIndex((b) => b.kind === 'paragraph');
    return i >= 0 ? i : 1;
  }

  // the page's LAST paragraph block (low on the page: the scroll step)
  async function lastParagraphIndex() {
    const m = /^\/setup\/(.+)$/.exec(page);
    const text = m ? await readText(`../../content/setup/${m[1]}.md`) : null;
    const split = text ? window.HCCore.splitBlocks(text) : null;
    const blocks = split && split.ok ? split.blocks : [];
    for (let i = blocks.length - 1; i >= 0; i -= 1) if (blocks[i].kind === 'paragraph') return i;
    throw new Error(`the walk page ${page} has no paragraph block`);
  }

  // ask the page frame for its scroll record; the next answer after asking
  async function askScroll(what) {
    const seenBefore = scrollReplies.length;
    return until(() => {
      const f = pageFrame();
      if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'hc-walk-scroll' }, '*');
      return scrollReplies.length > seenBefore ? scrollReplies[scrollReplies.length - 1] : null;
    }, `the frame's hc-walk-scroll answer (${what})`);
  }

  // what the page body carries: the counts, first/last/max, the first 40 samples, the log (capped)
  function scrollSummary(r) {
    const ys = r.samples.map((x) => x[1]);
    return { nonce16: r.nonce16, loadedAt: r.loadedAt, now: r.now, count: ys.length,
      first: ys.length ? ys[0] : null, last: ys.length ? ys[ys.length - 1] : null, max: ys.length ? Math.max(...ys) : null,
      samples: r.samples.slice(0, 40), logCount: r.log.length, log: r.log.slice(0, 300) };
  }

  async function editorOn() {
    const sw = await until(() => { const b = $('[data-editor-switch]'); return b && !b.disabled ? b : null; },
      'the Editor switch (GitHub access confirmed)');
    sw.click();
    await until(() => SD.body.classList.contains('hc-editor-on'), 'body.hc-editor-on');
    const nonce = await frameReady(null);
    // U7 (plan D12): the page stays on screen until the frame's first paint; every step shoots the frame
    await until(() => SD.body.classList.contains('hc-frame-live'), 'the frame on screen (body.hc-frame-live)');
    return nonce;
  }

  const blockEditor = () => $('textarea[data-block-editor]');

  // what a failure line carries: the page frame, the hc-ready count, the tray's notice
  function diag() {
    try {
      const f = pageFrame();
      const notice = $('#hc-tray .hc-notice');
      return `frame=${f ? 'yes' : 'no'} nonce=${nonceOf(f) ? 'yes' : 'no'} readies=${readies.length} seen=${JSON.stringify(seen)}`
        + ` body=${SD.body.className} notice=${notice ? notice.textContent.slice(0, 120) : ''}`;
    } catch (e) { return 'no site document'; }
  }

  // Edit access: Editor OFF, the box at the top of a project page's aside
  const accessBoxReady = async (check) => {
    await until(() => $('[data-editor-switch]') && !$('[data-editor-switch]').disabled, 'the role read (the switch enabled)');
    const box = await until(() => $('.aside-box .hc-access'), 'the Edit access box on the project page');
    await until(() => check(box), 'the box in the step\'s state');
    // the aside is sticky (scrollIntoView lands anywhere): the page's top shows the title and the box
    SW.scrollTo({ top: 0, behavior: 'instant' });
  };
  const accessText = (box) => (box.querySelector('.hc-access-text') || {}).textContent || '';

  /* The walk's steps, one labelled block per unit (editor UI/UX build, U0): a unit adds its steps in its own block.
     Each step is an async function that resolves once its state is on screen. STEPS is the registry's keys; the
     registry is built at the top (stepRegistry is hoisted) so an unknown step is refused before anything loads. */
  function stepRegistry() {
    return {
      /* ---- U0 (existing) ---- */
      on: async () => { await editorOn(); },
      select: async () => {
        await editorOn();
        frameSays('hc-block-select', { index: await paragraphIndex() });
        await until(() => { const t = blockEditor(); return t && t.value.trim(); }, 'the block\'s text in the tray');
        await until(() => SD.body.classList.contains('hc-tray-open'), 'the open tray');
      },
      edit: async () => {
        const before = await editorOn();
        frameSays('hc-block-select', { index: await paragraphIndex() });
        const ta = await until(() => { const t = blockEditor(); return t && t.value.trim() ? t : null; }, 'the block editor');
        ta.value += ' The walk typed this sentence.';
        ta.dispatchEvent(new SW.Event('input', { bubbles: true }));
        await frameReady(before);            // reloaded with a NEW nonce, the block still selected
        await until(() => /walk typed/.test(blockEditor().value), 'the edit kept in the tray');
      },
      insert: async () => {
        await editorOn();
        const index = await paragraphIndex();
        const want = SW.HCEditorFrame.INSERT_KINDS.map((k) => k.kind);   // the site's own copy of the file
        let reply = null;
        await until(() => {
          const f = pageFrame();
          if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'hc-walk-picker', index }, '*');
          reply = pickerReplies.length ? pickerReplies[pickerReplies.length - 1] : null;
          return reply && reply.index === index && reply.open === true;
        }, `the frame's "+" picker open before block ${index} (last answer ${JSON.stringify(reply)})`);
        if (JSON.stringify(reply.kinds) !== JSON.stringify(want)) {
          throw new Error(`the picker shows ${JSON.stringify(reply.kinds)}, not ${JSON.stringify(want)}`);
        }
      },
      inserted: async () => {
        const before = await editorOn();
        frameSays('hc-block-insert', { index: await paragraphIndex(), kind: 'note' });
        await until(() => { const t = blockEditor(); return t && /adm-note/.test(t.value); }, 'the inserted note in the tray');
        await frameReady(before);
      },
      // U0b: the proposals list is gone; the phone shows the dock (U2 re-points this step to the sheet)
      phone: async () => {
        await editorOn();
        await until(() => SD.body.classList.contains('hc-phone'), 'body.hc-phone (a viewport under 768 px)');
        await until(() => { const d = $('.hc-dock'); return d && !d.hidden ? d : null; }, 'the dock');
      },
      // U0b: no page bar; proposal #2 is on the page when its review cards are (the conflict one among them)
      'overlay-inline': async () => {
        await editorOn();
        await until(() => $('#hc-frame-host .hc-rcard[aria-label$="suggested by walk-proposer"]'), 'proposal #2\'s review cards');
        await until(() => $('#hc-frame-host .hc-rcard.is-conflict'), 'the change main also changed (its card)');
      },
      'overlay-side': async () => {
        await REGISTRY['overlay-inline']();
      },
      // U0b: no page bar listing the other; the newest (#3) is the one drawn (its review cards)
      'two-prs': async () => {
        await editorOn();
        await until(() => $('#hc-frame-host .hc-rcard[aria-label$="suggested by newer-proposer"]'), 'the newest proposal\'s (#3) review cards');
      },
      // U4: Editor stays OFF; the members-only detail under the page's public GitHub surfaces
      members: async () => {
        await until(() => $('[data-editor-switch]') && !$('[data-editor-switch]').disabled, 'the role read (the switch enabled)');
        if (page === '/lab') {
          const sec = await until(() => $('.hc-m-people'), '"People committing this year"');
          await until(() => $('.hc-m-author') || $('.hc-m-people .hc-m-error'), 'an author on a recent commit');
          (SD.querySelector('.hc-cols') || sec).scrollIntoView({ block: 'start', behavior: 'instant' });
          const row = await until(() => $('.hc-m-people [data-hc-login]'), 'a row with a login');
          row.click();
          await until(() => $('.hc-person-pop .hc-pp-members'), 'the members-only part of the popover');
          return;
        }
        if (page === '/about') {
          const strip = await until(() => $('.hc-gh-strip'), 'a GitHub strip on a roster card');
          strip.closest('.people-group').scrollIntoView({ block: 'start', behavior: 'instant' });
          return;
        }
        const box = await until(() => $('.hc-authors .hc-m-authors'), 'the members-only lines under "who wrote this"');
        await until(() => box.querySelector('.hc-m-line') || box.querySelector('.hc-m-error'), 'a counts line');
        box.closest('.hc-authors').scrollIntoView({ block: 'start', behavior: 'instant' });
      },
      // Edit access: Editor OFF, the box at the top of a project page's aside
      'access-sitewide': () => accessBoxReady((b) => /^You can edit every project \((Maintainer|Admin)\)\.$/.test(accessText(b))),
      'access-commits': () => accessBoxReady((b) => /^You can edit this project: you have commits in/.test(accessText(b))),
      'access-added': () => accessBoxReady((b) => accessText(b) === 'An admin gave you access to this project.'),
      'access-removed': () => accessBoxReady((b) => accessText(b) === 'An admin removed your access to this project.'
        && b.querySelector('button[data-action="access-request"]')),
      'access-nowrite': () => accessBoxReady((b) => /^You have commits here, but/.test(accessText(b))
        && b.querySelector('a[data-action="access-issue"]')),
      'access-none': () => accessBoxReady((b) => /^You have no commits/.test(accessText(b))
        && b.querySelector('button[data-action="access-request"]')),
      'access-admin': () => accessBoxReady((b) => accessText(b) === 'You can edit every project (Admin).'
        && b.querySelector('button[data-action="access-remove"]') && b.querySelector('button[data-action="access-add"]')),
      // (U0b removed 'access-proposals': its proposals list with the access labels is gone)

      /* ---- U2 ---- */

      /* ---- U3 ---- */

      /* ---- U4 ---- */

      /* ---- U5 ---- */

      /* ---- U6 ---- */

      /* ---- U7 ---- */
      // plan D12 (ED3, ED22, ED23): Editor on changes nothing in the page's geometry. Before: #content and the
      // sidebar as the signed-out page draws them; after the frame took #content's place (body.hc-frame-live,
      // its first paint): the frame's own #content (through the hc-walk-scroll hook's rects, moved into this
      // page's coordinates by the frame's position) and the sidebar again. Ready only when equal within 1 px.
      'on-geometry': async () => {
        SW.scrollTo({ top: 0, behavior: 'instant' });
        const box = (n) => { if (!n) return null; const r = n.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; };
        // the text column: #content's box inside its padding (above 900 px the frame host holds part of it)
        const column = (r, pad) => (r && pad ? { left: r.left + pad.left, top: r.top + pad.top, width: r.width - pad.left - pad.right } : null);
        const padOf = (n) => { const cs = SW.getComputedStyle(n); return { left: parseFloat(cs.paddingLeft), right: parseFloat(cs.paddingRight), top: parseFloat(cs.paddingTop) }; };
        const heading = $('#content h1');
        if (!heading) throw new Error(`the walk page ${page} has no h1 in #content: nothing to measure`);
        // the sidebar is compared only when it is on screen before (the orchestrator's 390 px walk, round 2): on a
        // phone (body.hc-phone) or with the drawer closed (at 900 px and below the sidebar is a drawer off the
        // left edge) the parent's sidebar is off screen and the frame's is hidden; there only the column and h1 count
        const onScreen = (n) => {
          if (!n || SD.body.classList.contains('hc-phone')) return false;
          if (SW.matchMedia('(max-width: 900px)').matches && !SD.body.classList.contains('hc-drawer-open')) return false;
          const r = n.getBoundingClientRect();
          return r.width > 0 && r.height > 0 && r.right > 0 && r.left < SW.innerWidth && r.bottom > 0 && r.top < SW.innerHeight;
        };
        const before = { content: box($('#content')), heading: box(heading), sidebar: box($('#sidebar')), sidebarShown: onScreen($('#sidebar')) };
        before.column = column(before.content, padOf($('#content')));
        // the swap: when body.hc-frame-live came, and how many hc-ready the current load had said by then
        const LIVE_FALLBACK_MS = 8000;       // js/editor.js frameReady: the frame takes over without its paint signal
        let onAt = null;                     // Editor on (the click), then the swap
        let swap = null;
        const watch = new SW.MutationObserver(() => {
          if (onAt === null && SD.body.classList.contains('hc-editor-on')) onAt = Date.now();
          if (swap || onAt === null || !SD.body.classList.contains('hc-frame-live')) return;
          const n = nonceOf(pageFrame());
          swap = { ms: Date.now() - onAt, readies: readies.filter((x) => x === n).length };
        });
        watch.observe(SD.body, { attributes: true, attributeFilter: ['class'] });
        let nonce;
        try { nonce = await editorOn(); } finally { watch.disconnect(); }
        await sleep(SETTLE_MS);
        const reply = await askScroll('the frame\'s content column');
        const f = box(pageFrame());
        const shift = (r) => (r ? { left: r.left + f.left, top: r.top + f.top, width: r.width, height: r.height } : null);
        const inner = reply.rects && reply.rects.content;
        const after = { content: shift(inner), heading: shift(reply.rects && reply.rects.heading),
          sidebar: box($('#sidebar')), frame: f, contentShown: $('#content') ? SW.getComputedStyle($('#content')).display : null };
        after.column = column(after.content, inner && inner.pad);
        const off = [];
        const near = (a, b, keys, what) => {
          if (!a || !b) { off.push(`${what}: missing`); return; }
          for (const k of keys) if (Math.abs(a[k] - b[k]) > 1) off.push(`${what}.${k} ${a[k]} -> ${b[k]}`);
        };
        near(before.column, after.column, ['left', 'top', 'width'], 'column');
        near(before.heading, after.heading, ['left', 'top', 'width'], 'heading');
        if (before.sidebarShown) near(before.sidebar, after.sidebar, ['left', 'top', 'width', 'height'], 'sidebar');
        // review minor 7: the page itself is gone once the frame is on screen
        if (after.contentShown !== 'none') off.push(`#content still drawn (display ${after.contentShown})`);
        // review minor 6: the swap came from THIS load's paint signal (its second hc-ready), not the 8 s fallback
        const said = readies.filter((x) => x === nonce).length;
        if (!swap) off.push('no swap seen');
        else if (swap.readies !== 2) off.push(`swap after ${swap.readies} hc-ready of this load (want 2: handshake, paint)`);
        if (swap && swap.ms >= LIVE_FALLBACK_MS) off.push(`swap at ${swap.ms} ms: the ${LIVE_FALLBACK_MS} ms fallback, not the paint`);
        if (said !== 2) off.push(`this load said hc-ready ${said} times (want 2)`);
        const scrollbars = { window: SW.innerWidth - SD.documentElement.clientWidth,
          host: SW.getComputedStyle($('#hc-frame-host')).getPropertyValue('--hc-sb').trim() };
        body.setAttribute('data-walk-geometry', JSON.stringify({ before, after, swap, readies: said, scrollbars, off }));
        if (off.length) throw new Error(`the page moved when Editor turned on: ${off.join('; ')}`);
      },
      // the frame scrolls the selected block (the page's LAST paragraph, low on the page) into view and holds
      // still there: its scrollY (the hc-walk-scroll hook) is >= 100 px and steady over 3 answers (+-2 px).
      // No typing here (U4 owns typing). Writes data-walk-scroll-before (JSON).
      scroll: async () => {
        await editorOn();
        frameSays('hc-block-select', { index: await lastParagraphIndex() });
        const end = Date.now() + LIMIT_MS;
        const run = [];
        let steady = null;
        while (!steady) {
          if (Date.now() > end) throw new Error(`the frame never held still at >= 100 px (last ${JSON.stringify(run.map((r) => r.now))})`);
          const r = await askScroll('after the pick');
          if (r.now >= 100 && run.length && Math.abs(r.now - run[run.length - 1].now) <= 2) run.push(r);
          else run.splice(0, run.length, r);
          if (run.length >= 3 && run[0].now >= 100) steady = r;
          else await sleep(100);
        }
        body.setAttribute('data-walk-scroll-before', JSON.stringify(scrollSummary(steady)));
      },
    };
  }

  site.addEventListener('load', async () => {
    try {
      SW = site.contentWindow;
      SD = site.contentDocument;
      SW.addEventListener('message', (e) => {
        const m = e.data;
        if (m && typeof m === 'object') seen[m.type] = (seen[m.type] || 0) + 1;
        if (m && typeof m === 'object' && m.type === 'hc-ready' && typeof m.nonce === 'string') readies.push(m.nonce);
      });
      await until(() => SW.HCApp && SD.querySelector('#content h1'), 'the site\'s page');
      const overlay = OVERLAY_STEPS.indexOf(step) >= 0;
      const user = JSON.parse(await readText('fixtures/github-data/user.json'));
      const access = ACCESS_STEPS.indexOf(step) >= 0;
      const fake = fakeFor(overlay ? await synthetic() : (step === 'members' ? await membersExtra()
        : (access ? await accessExtra(String(user.login)) : undefined)));
      // the View settings are this browser's: the walk sets them for its step (side by side only there)
      try {
        if (step === 'overlay-side') {
          SW.localStorage.setItem('hc-editor-view', JSON.stringify({ suggestions: true, diff: 'side', compact: false, outlines: true }));
        } else if (overlay) SW.localStorage.removeItem('hc-editor-view');
        // the access steps start with Editor OFF, whatever an earlier step in this tab left on
        if (access) SW.sessionStorage.removeItem('hc-editor');
      } catch (e) { /* the defaults */ }
      const started = await SW.HCApp.loadEditor({ fetch: fake.fetch,
        session: { token: 'walk-fake-not-a-token', login: String(user.login), expiresAt: null } });
      if (started !== true) throw new Error('HCApp.loadEditor did not start the editor');
      await REGISTRY[step]();
      await sleep(SETTLE_MS);
      mark(`${step}:ready`);
    } catch (e) {
      fail(`${(e && e.message) || e}; ${diag()}`);
    }
  });
}());
</script>
</body>
</html>
